<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity -->
    <title>Zapis — Notes & Todos, Local and Private</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="description"
      content="Zapis is a local-first, distraction-free workspace for notes and todos. No accounts. No cloud. Your thoughts, owned by you."
    />

    <!-- Privacy & indexing (intentional restraint) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme (optional but practical) -->
    <meta name="theme-color" content="#0f0f0f" />

    <!-- PWA baseline (only if you plan offline installability) -->
    <meta name="application-name" content="Zapis" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zapis" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Zapis — Notes & Todos, Local and Private"
    />
    <meta
      property="og:description"
      content="Zapis is a local-first, distraction-free workspace for notes and todos. No accounts. No cloud. Your thoughts, owned by you."
    />
    <meta property="og:url" content="https://zapis-notes.vercel.app/" />
    <meta
      property="og:image"
      content="https://zapis-notes.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Zapis - local, private notes and todos"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
